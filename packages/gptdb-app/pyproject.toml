[project]
name = "gptdb-app"
version = "0.1.0"
description = "GPT-DB application runtime and orchestration layer"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

authors = [
    { name = "Md Sulaiman", email = "dev.sulaiman@icloud.com" }
]

dependencies = [
    "gptdb",
    "gptdb-ext",
    "gptdb-serve",
    "gptdb-client",

    # accelerator / automation (verify PyPI availability)
    "gptdb-acc-auto",

    "aiofiles",
    "pyparsing",
]


[project.urls]
Homepage = "https://github.com/khulnasoft/GPT-DB"
Documentation = "https://gpt.khulnasoft.com/docs/overview"
Repository = "https://github.com/khulnasoft/GPT-DB.git"
Issues = "https://github.com/khulnasoft/GPT-DB/issues"


[project.optional-dependencies]
cache = [
    "rocksdict",
]

observability = [
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp",
]

# Full GPT-DB feature set
base = [
    "gptdb[client,cli,agent,simple_framework,framework,code]",
]

# Legacy / transitional tooling (planned removal)
gptdbs = [
    "build",
    "poetry",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.uv]
managed = true

[tool.uv.dependency-groups.dev]
dependencies = []


[tool.hatch.build.targets.wheel]
packages = ["src/gptdb_app"]
exclude = [
    "src/gptdb_app/**/tests",
    "src/gptdb_app/**/examples",
]
