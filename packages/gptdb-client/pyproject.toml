[project]
name = "gptdb-client"
version = "0.1.0"
description = "GPT-DB Python client"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

authors = [
    { name = "Md Sulaiman", email = "dev.sulaiman@icloud.com" }
]

dependencies = [
    "gptdb[client,cli]",
    "gptdb-ext",
    "shortuuid",

    # SQLAlchemy 2.0.29 drops DuckDB support
    "SQLAlchemy>=2.0.25,<2.0.29",

    # cache & serialization
    "msgpack",
    "cloudpickle",
]

[project.urls]
Homepage = "https://github.com/khulnasoft/GPT-DB"
Documentation = "https://gpt.khulnasoft.com/docs/overview"
Repository = "https://github.com/khulnasoft/GPT-DB.git"
Issues = "https://github.com/khulnasoft/GPT-DB/issues"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.uv]
managed = true

[tool.uv.dependency-groups.dev]
dependencies = []


[tool.hatch.build.targets.wheel]
packages = ["src/gptdb_client"]
exclude = [
    "src/gptdb_client/**/tests",
    "src/gptdb_client/**/examples",
]
